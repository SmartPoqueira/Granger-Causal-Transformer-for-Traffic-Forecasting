seed: 42

data:
  trends_file: "data/google_trends_data.csv"
  plates_file: "data/unique_num_plate_count_per_week.csv"
  normalize: true
  apply_eemd: true
  eemd_num_imfs: 5
  eemd_noise_width: 0.05

granger:
  max_lag: 6
  p_value_threshold: 0.05
  correlation_threshold: 0.5
  alpha: 1.0  # Causal attention scaling factor

model:
  model_dim: 64
  num_heads: 4
  num_layers: 2
  dropout: 0.1
  context: 6  # Input window size

training:
  optimizer: adam
  learning_rate: 0.01
  epochs: 200
  lam: 0.001         # L1 regularization on causality gates
  lam_ridge: 0.001   # Ridge regularization
  batch_size: 128
  check_every: 1
  verbose: 1

cv:
  n_splits: 10
  min_train_ratio: 0.5
  max_train_ratio: 0.8
  test_ratio: 0.2

output_dir: "results"
